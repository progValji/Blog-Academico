<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inicia Sesión</title>
    <style>
        .form-container {
            display: none;
            animation: slideIn 0.5s ease-in-out;
        }
        .form-container.active {
            display: block;
        }
        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateX(20px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }
    </style>
</head>
<body>
    <div id="iniciar" class="form-container active">
        <form method="post">
            <h1>Inicia sesión</h1>
            <input type="hidden" name="action" value="iniciar">
            <div>
                <input type="email" id="correo" name="correo" required>
                <label for="correo">Correo</label>
            </div>
            <div>
                <input type="password" id="contraseña" name="contraseña" required>
                <label for="contraseña">Contraseña</label>
            </div>
            <button type="submit">Iniciar</button>
            <p><a href="#" onclick="cambiarFormulario('registrar')">¿No tienes cuenta? Regístrate aquí</a></p>
        </form>
    </div>

    <div id="registrar" class="form-container">
        <form method="post">
            <h1>Crea tu cuenta</h1>
            <input type="hidden" name="action" value="registrar">
            <div>
                <input type="text" name="nombre" id="nombre" required>
                <label for="nombre">Nombre</label>
            </div>
            <div>
                <input type="email" id="correo2" name="correo" required>
                <label for="correo2">Correo</label>
            </div>
            <div>
                <input type="password" id="contraseña2" name="contraseña" required>
                <label for="contraseña2">Contraseña</label>
            </div>
            <button type="submit">Registrate</button>
            <p><a href="#" onclick="cambiarFormulario('iniciar')">¿Ya tienes cuenta? Inicia sesión aquí</a></p>
        </form>
    </div>

    {% if mensaje %}
    <h1>{{ mensaje }}</h1>
    {% endif %}

    <script>
        function cambiarFormulario(formulario) {
            document.getElementById('iniciar').classList.remove('active');
            document.getElementById('registrar').classList.remove('active');
            document.getElementById(formulario).classList.add('active');
        }

        // Detectar parámetro inicial
        /*
            1. obtiene los parametros enviados
            2. convierte el string en un objeto que se puede consultar facilmente
            3. estrae el valor del parametro
        */
        const params = new URLSearchParams(window.location.search);
        const form = params.get('form') || 'iniciar';
        cambiarFormulario(form);
    </script>
</body>
</html>
