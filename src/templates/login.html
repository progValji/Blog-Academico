<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../static/CSS/output.css">
    <style>
        #iniciar__form{display: none;}

        .form__container{display: block; position: relative;}

        .form, .overlay__panel {
            position: absolute;
            width: 100%;
            left: 0;
            top: 0;
            opacity: 0;
            transform: translateY(40px) scale(.9);
            transition: 
                opacity 1s ease,
                transform 1s ease;
            pointer-events: none;
        }

        .login__active, .overlay__active{
            opacity: 1;
            transform: translateY(0) scale(1);
            pointer-events: auto;
            position: relative;
        }

    </style>
    <title>Inicia Sesión - Blog Academico</title>
</head>
<body class=" bg-gray-200" >

    <section class="contenedor my-8 shadow-xl">

        <div class="overlay__container">
            <div class="h-79 flex items-center overlay bg-azul__petroleo text-white py-10 px-8 rounded-t-xl">

                <div class="overlay__panel overlay__active" id="registrar__overlay">
                    <h1 class="text-4xl font-bold text-center">¡Hola!</h1>
                    <p class="mt-4 text-center">Crea tu cuenta ahora para tener acceso a nuestros servicios</p>
                    <button class="border-2 mt-8
                    px-4 py-2 rounded-xl mx-auto block 
                    transition-all duration-500 
                    hover:bg-fondo hover:text-negro__suave hover:border-fondo hover:-translate-y-1"
                    onclick="cambiarFormulario('iniciar')">Iniciar Sesión</button>
                </div>

                <div class="overlay__panel" id="iniciar__overlay">
                    <h1 class="text-4xl font-bold text-center">¡Bienvenido de nuevo!</h1>
                    <p class="mt-4 text-center">Inicia sesion con tu cuenta</p>
                    <p class="text-center mt-8"><a class="underline hover:no-underline" 
                        href="{{ url_for('solicitar_recuperacion') }}">
                            ¿Olvidaste tu contraseña?
                    </a></p>
                    <button class="border-2 mt-4
                    px-4 py-2 rounded-xl mx-auto block 
                    transition-all duration-500 
                    hover:bg-fondo hover:text-negro__suave hover:border-fondo hover:-translate-y-1"
                    , onclick="cambiarFormulario('registrar')">
                        Registrar</button>
                    </div>
                </div>

            </div>
        </div>

        <div class="form__container">
            <div class="form__slider 
            h-115.5 flex items-center py-10 px-8 rounded-b-xl bg-fondo">

                <form method="post" id="iniciar" class="form 
                bg-inherit flex flex-col gap-4">
                    <h1 class="text-3xl text-center font-semibold mb-8">Inicia sesión</h1>
                    <input type="hidden" name="action" value="iniciar">
                    <div class="input__formulario">
                        <input type="email" id="correo" name="correo" placeholder="" required>
                        <label for="correo">Correo</label>
                        <span></span>
                    </div>
                    <div class="input__formulario">
                        <input type="password" id="contraseña" name="contraseña" minlength="8" 
                        placeholder="" required>
                        <label for="contraseña">Contraseña</label>
                        <span></span>
                    </div>
                    <button type="submit" class="submit__formulario block
                    text-white bg-verde__menta w-full">Iniciar</button>
                </form>
                <form method="post" id="registrar" class="form login__active
                bg-inherit flex flex-col gap-4">
                    <h1 class="text-3xl text-center font-semibold mb-8">Crea tu cuenta</h1>
                    <input type="hidden" name="action" value="registrar">
                    <div class="input__formulario">
                        <input type="text" name="nombre" id="nombre" minlength="4"
                         placeholder="" required>
                        <label for="nombre">Nombre</label>
                        <span></span>
                    </div>
                    <div class="input__formulario">
                        <input type="email" id="correo" name="correo" placeholder="" required>
                        <label for="correo">Correo</label>
                        <span></span>
                    </div>
                    <div class="input__formulario">
                        <input type="password" id="contraseña" name="contraseña" minlength="8"
                        placeholder="" required>
                        <label for="contraseña">Contraseña</label>
                        <span></span>
                    </div>
                    <button type="submit" class="submit__formulario block
                    text-white bg-verde__menta w-full">Registrar</button>
                </form>

            </div>
        </div>

    </section>

    <script>
        function cambiarFormulario(formulario){
            document.querySelector('.login__active').classList.remove('login__active')
            document.querySelector('.overlay__active').classList.remove('overlay__active')
            setTimeout(() =>{
                document.getElementById(formulario).classList.add('login__active')
                const overlay = formulario+'__overlay'
                document.getElementById(overlay).classList.add('overlay__active')
            }, 1000)
        }
    </script>

</body>
</html>
