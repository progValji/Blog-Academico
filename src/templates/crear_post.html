{% extends "base.html" %}

{% block contenido %}

    <section>
    {% with messages = get_flashed_messages(with_categories=True) %}
      {% if messages %}
        <ul class="flashes">
          {% for category, message in messages %}
            <li class="{{ category }}">{{ message }}</li>
          {% endfor %}
        </ul>
      {% endif %}
    {% endwith %}
    </section>

    <h1>Crear nuevo Post</h1>
    
    <form method="post" enctype="multipart/form-data">
        <div>
            <label for="titulo">Título</label>
            <input id="titulo" name="titulo" type="text" required autocomplete="off">
        </div>

        <div>
            <label for="contenido">Escribe tu post aqui...</label>
            <textarea id="contenido" name="contenido" required></textarea>
        </div>

        <div>
            <label for="adjuntos">Adjuntar archivos</label>
            <input id="adjuntos" name="adjuntos" type="file" multiple>
        </div>

        <div id="filesPreview" class="files-list" aria-live="polite"></div>

        <div class="actions">
            <button type="submit">Publicar</button>
            <a href="{{ url_for('index') }}" style="align-self:center">Cancelar</a>
        </div>
    </form>
{% endblock %}
