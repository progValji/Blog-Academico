{% extends "base.html" %}

{% block contenido %}
<section class="contenedor max-w-125 my-12">
        {% if token_valido %}
            <div class="w-[90%] max-w-6xl mx-auto rounded-3xl bg-white p-8 shadow-2xl lg:grid lg:grid-cols-[1fr_1.2fr] gap-8" style="box-shadow: var(--shadow-card)">
                <div class="flex flex-col justify-center gap-4">
                    <h2 class="text-4xl text-azul-marino font-bold">🔐 Nueva Contraseña</h2>
                    <p class="text-gris-oscuro leading-relaxed">Ingresa una contraseña nueva y segura para proteger tu cuenta.</p>
                </div>

                <form method="POST" class="flex flex-col gap-4">
                    <div class="input__formulario">
                        <input type="password" id="contraseña" name="nueva_contraseña" 
                        placeholder="" required minlength="8">
                        <label for="nueva_contraseña">Nueva Contraseña</label>
                        <button type="button" class="tooglePassword" data-visible="false">👁️</button>
                        <span></span>
                    </div>
                    <div class="input__formulario">
                        <input type="password" id="contraseña" name="confirmar_contraseña" 
                        placeholder="" required minlength="8">
                        <label for="confirmar_contraseña">Confirmar Contraseña</label>
                        <button type="button" class="tooglePassword" data-visible="false">👁️</button>
                        <span></span>
                    </div>
                    
                    <button type="submit" disabled
                     class="submit__formulario bg-azul-pizarra text-white">Restablecer Contraseña</button>
                </form>
            </div>

            <script type="module">
                import { inicializarValidacionFormulario } from '../../static/JS/formValidador.js'
                const form = document.querySelector('form')
                inicializarValidacionFormulario(form)
            </script>

            <script src="{{ url_for('static', filename='JS/tooglePassword.js') }}"></script>

        {% else %}
            <div class="w-[90%] max-w-lg mx-auto rounded-3xl bg-white p-8 shadow-2xl flex flex-col gap-8 text-center" style="box-shadow: var(--shadow-card)">
                <h2 class="text-2xl text-azul-marino font-bold">🚫 Token Inválido 🚫</h2>
                <div class="mt-auto text-center">
                    <p><a href="{{ url_for('auth.solicitar_recuperacion')}}">← Solicitar nuevo enlace</a></p>
                    <p class="mt-4"><a href="{{ url_for('auth.iniciar_sesion') }}">← Ir al Login</a></p>
                </div>
            </div>
        {% endif %}
</section>
{% endblock %}
