<style>
    #iniciar__form{display: none;}

    .form__container{display: block; position: relative;}

    .form, .overlay__panel {
        position: absolute;
        width: 100%;
        left: 0;
        top: 0;
        opacity: 0;
        transform: translateY(40px) scale(.9);
        transition: 
            opacity 1s ease,
            transform 1s ease;
        pointer-events: none;
    }

    .login__active, .overlay__active{
        opacity: 1;
        transform: translateY(0) scale(1);
        pointer-events: auto;
        position: relative;
    }
</style>
{% extends "base.html" %}

{% block contenido %}
<section class=" bg-gray-200 md:h-screen md:flex md:items-center">

    <section class="w-[90%] max-w-175 mx-auto my-8 shadow-xl md:my-0 md:flex">

        <div class="overlay__container bg-azul__petroleo text-white
        md:basis-[50%]">
            <div class="overlay h-79 flex items-center py-10 px-8 relative max-w-xl mx-auto
            md:h-full">

                <div class="overlay__panel overlay__active text-center relative z-20" id="registrar__overlay">
                    <h1 class="text-5xl font-bold">¡Hola!</h1>
                    <p class="mt-4 text-lg">Crea tu cuenta ahora para tener acceso a nuestros servicios.</p>
                    <button class="border-2 mt-8 rounded-xl
                    px-4 py-2 mx-auto block 
                    transition-all duration-500 
                    hover:bg-fondo hover:text-negro__suave hover:border-fondo hover:-translate-y-1"
                    onclick="cambiarFormulario('iniciar')">Iniciar Sesión</button>
                </div>

                <div class="overlay__panel text-center relative z-20" id="iniciar__overlay">
                    <h1 class="text-4xl font-bold sm:text-5xl">¡Bienvenido de nuevo!</h1>
                    <p class="mt-4 text-lg">Ingresa tus datos para acceder tu cuenta.</p>
                    <p class="mt-8"><a class="underline hover:no-underline" 
                        href="{{ url_for('auth.solicitar_recuperacion') }}">
                            ¿Olvidaste tu contraseña?
                    </a></p>
                    <button class="border-2 mt-4
                    px-4 py-2 rounded-xl mx-auto block 
                    transition-all duration-500 
                    hover:bg-fondo hover:text-negro__suave hover:border-fondo hover:-translate-y-1"
                    , onclick="cambiarFormulario('registrar')">
                        Registrar</button>
                    </div>
                </div>

            </div>
        </div>

        <div class="form__container bg-fondo
        md:basis-[50%]">
            <div class="form__slider 
            h-115.5 flex items-center py-10 px-8 max-w-xl mx-auto bg-inherit">

                <form method="post" id="iniciar" class="form
                bg-inherit flex flex-col gap-4">
                    <h1 class="text-3xl text-center font-semibold mb-8 text-azul__petroleo
                    sm:text-4xl">Inicia sesión</h1>
                    <input type="hidden" name="action" value="iniciar">
                    <div class="input__formulario">
                        <input type="email" id="correo" name="correo" placeholder="" required>
                        <label for="correo">Correo</label>
                        <span></span>
                    </div>
                    <div class="input__formulario">
                        <input type="password" id="contraseña" name="contraseña" minlength="8" 
                        placeholder="" required>
                        <label for="contraseña">Contraseña</label>
                        <button type="button" class="tooglePassword" data-visible="false">👁️</button>
                        <span></span>
                    </div>
                    <button type="submit" disabled class="submit__formulario block
                    text-white bg-verde__menta w-full">Iniciar</button>
                </form>
                <form method="post" id="registrar" class="form login__active
                bg-inherit flex flex-col gap-4">
                    <h1 class="text-3xl text-center font-semibold mb-4 text-azul__petroleo
                    sm:text-4xl">Crea tu cuenta</h1>
                    <input type="hidden" name="action" value="registrar">
                    <div class="input__formulario">
                        <input type="text" name="nombre" id="nombre" minlength="2"
                         placeholder="" required>
                        <label for="nombre">Nombre</label>
                        <span></span>
                    </div>
                    <div class="input__formulario">
                        <input type="email" id="correo" name="correo" placeholder="" required>
                        <label for="correo">Correo</label>
                        <span></span>
                    </div>
                    <div class="input__formulario">
                        <input type="password" id="contraseña" name="contraseña" minlength="8"
                        placeholder="" required>
                        <label for="contraseña">Contraseña</label>
                        <button type="button" class="tooglePassword" data-visible="false">👁️</button>
                        <span></span>
                    </div>
                    <button type="submit" disabled class="submit__formulario block
                    text-white bg-verde__menta w-full">Registrar</button>
                </form>

            </div>
        </div>

    </section>

        <script type="module">
            import { inicializarValidacionFormulario } from '../static/JS/formValidador.js'
        
            // inicializa el formulario visible al cargar (usa el que tenga .login__active o 'registrar' por defecto)
            const currentForm = document.querySelector('.login__active') || document.getElementById('registrar')
            inicializarValidacionFormulario(currentForm)
        
            // expone la función para los onclick inline y re-inicializa validación al cambiar
            window.cambiarFormulario = function(formulario){
                document.querySelector('.login__active').classList.remove('login__active')
                document.querySelector('.overlay__active').classList.remove('overlay__active')
                setTimeout(() =>{
                    const newForm = document.getElementById(formulario)
                    newForm.classList.add('login__active')
                    const overlay = formulario + '__overlay'
                    document.getElementById(overlay).classList.add('overlay__active')
                    // re-inicializa la validación para el formulario ahora activo
                    inicializarValidacionFormulario(newForm)
                }, 1000)
            }
    
            // lee parámetro 'form' solo si viene en la URL y es distinto al formulario activo
            const params = new URLSearchParams(window.location.search)
            const requested = params.get('form')
            if (requested && requested !== currentForm.id && ['iniciar','registrar'].includes(requested)) {
                cambiarFormulario(requested)
            }
        </script>

    <script src="{{ url_for('static', filename='JS/tooglePassword.js') }}"></script>

</section>
{% endblock %}
