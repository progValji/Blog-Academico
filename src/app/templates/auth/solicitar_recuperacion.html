{% extends "base.html" %}

{% block contenido %}
    <section class="contenedor max-w-125 my-12">
        <div class="w-full rounded-3xl bg-white p-8 shadow-2xl gap-8" style="box-shadow: var(--shadow-card)">
            <div class="flex flex-col justify-center gap-4">
                <h1 class="text-4xl text-azul-marino font-bold">Resetea tu contraseña</h1>
                <p class="text-gris-oscuro leading-relaxed">Introduce la dirección de correo electrónico verificada de tu cuenta y te enviaremos un enlace seguro para restablecer la contraseña.</p>
            </div>

            <form method="post" class="flex flex-col gap-6">
                <div class="input__formulario">
                    <input type="email" name="correo" id="correo" placeholder="" required>
                    <label for="correo">Correo electrónico</label>
                    <span></span>
                </div>

                <button type="submit" disabled
                class="submit__formulario bg-azul-pizarra text-white">Enviar Correo</button>
            </form>
        </div>

        <script type="module">
            import { inicializarValidacionFormulario } from '../static/JS/formValidador.js'
            const form = document.querySelector('form')
            inicializarValidacionFormulario(form)
        </script>
    </section>
{% endblock %}
