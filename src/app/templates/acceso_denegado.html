{% extends "base.html" %}

{% block contenido %}

        <h2>❌ No tienes acceso</h2>
        <p>Esta sección es solo para usuarios registrados.</p>
        <p>
            <a href="{{ url_for('auth.registrar') }}" style="background-color: #4CAF50; color: white; padding: 10px 20px; text-decoration: none; border-radius: 5px; display: inline-block;">
                Regístrate aquí
            </a>
            o
            <a href="{{ url_for('auth.iniciar_sesion') }}" style="background-color: #2196F3; color: white; padding: 10px 20px; text-decoration: none; border-radius: 5px; display: inline-block;">
                Inicia sesión
            </a>
        </p>
    </section>
{% endblock %}
