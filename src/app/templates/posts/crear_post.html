{% extends "base.html" %}

{% block contenido %}
    <section class="contenedor bg-white my-12 rounded-3xl p-8 md:p-10" style="box-shadow: var(--shadow-card);">
        <div class="mb-8 text-center">
            <h1 class="text-3xl font-bold text-azul-marino">Crear un post</h1>
            <p class="mt-3 text-gris-oscuro">Escribe tu contenido, adjunta archivos TXT o PDF y revisa 
              la lista antes de publicarlo.</p>
        </div>

        <form method="POST" enctype="multipart/form-data" class="flex flex-col gap-6 bg-inherit">
            <div class="input__formulario bg-inherit">
                <input type="text" id="titulo" name="titulo" placeholder=" " required autocomplete="off">
                <label for="titulo">Título</label>
                <span></span>
            </div>

            <div>
                <textarea id="contenido" name="contenido" rows="12" placeholder="Contenido..." required 
                class="resize-none w-full p-4 outline-0 border rounded-xl focus:border-azul-marino"></textarea>
            </div>

            <div>
                <label for="adjuntos" class="mb-3 block text-lg font-semibold text-azul-marino">Adjuntar archivos</label>
                <input type="file" id="adjuntos" name="adjuntos" accept=".txt,.pdf" multiple class="w-full rounded-xl border border-dashed border-slate-300 bg-slate-50 px-3 py-3 text-sm text-gris-oscuro">
                <p class="mt-2 text-sm text-gris-oscuro">Formatos permitidos: TXT y PDF</p>

                <div class="mt-5">
                    <p class="mb-3 text-sm font-semibold text-azul-marino">Previsualización de archivos</p>
                    <ul id="lista-adjuntos" class="flex flex-col gap-3"></ul>
                    <p id="preview-empty" class="rounded-xl border border-dashed border-slate-300 bg-slate-50 px-4 py-5 text-center text-sm text-gris-oscuro">
                        Aún no has seleccionado archivos.
                    </p>
                </div>
            </div>

            <button type="submit" class="submit__formulario bg-azul-pizarra text-white">Publicar post</button>
        </form>
    </section>

<script src="{{ url_for('static', filename='JS/crear_post.js') }}"></script>
{% endblock %}
