{% macro render_comentario(comentario, user_id, mostrar_link_post=None, next='visualizar_post') %}
    <li class="comentario relative">
        {% if comentario.user_id == user_id %}
            <div class="dropdown absolute top-1 right-1">
                <button class="dropdown-btn text-gris">
                    <svg xmlns="http://www.w3.org/2000/svg" width="36" height="36" viewBox="0 0 24 24" 
                    fill="currentColor" stroke="white" stroke-width="2" stroke-linecap="round" 
                    stroke-linejoin="round" class="icon icon-tabler icons-tabler-outline 
                    icon-tabler-settings">
                    <path stroke="none" d="M0 0h24v24H0z" fill="none"/>
                    <path d="M10.325 4.317c.426 -1.756 2.924 -1.756 3.35 0a1.724 1.724 0 0 0 2.573 
                    1.066c1.543 -.94 3.31 .826 2.37 2.37a1.724 1.724 0 0 0 1.065 2.572c1.756 .426 
                    1.756 2.924 0 3.35a1.724 1.724 0 0 0 -1.066 2.573c.94 1.543 -.826 3.31 -2.37 
                    2.37a1.724 1.724 0 0 0 -2.572 1.065c-.426 1.756 -2.924 1.756 -3.35 0a1.724
                    1.724 0 0 0 -2.573 -1.066c-1.543 .94 -3.31 -.826 -2.37 -2.37a1.724 1.724 0 0 0 
                    -1.065 -2.572c-1.756 -.426 -1.756 -2.924 0 -3.35a1.724 1.724 0 0 0 1.066 -2.573c-.94 
                    -1.543 .826 -3.31 2.37 -2.37c1 .608 2.296 .07 2.572 -1.065" />
                    <path d="M9 12a3 3 0 1 0 6 0a3 3 0 0 0 -6 0" /></svg>
                </button>
                <ul class="dropdown-content">
                    <li>
                        <button 
                            type="button"
                            data-title="¿Estas seguro de eliminar este comentario?"
                            data-message="Esta acción no se puede deshacer."
                            data-action="/comments/eliminar_comentario/{{ comentario.id }}"
                            class="open_delete_modal w-37.5 px-4 py-2 rounded-2xl text-white
                            bg-red-600 hover:bg-red-700">
                            Eliminar
                        </button>
                    </li>
                </ul>
            </div>
        {% endif %}
        <div class="flex justify-between items-center">
            <small class="text-gris-oscuro sm:text-base">📅 {{ comentario.created_at | tiempo_relativo}}</small>
            <small class="sm:text-base">👤 {{ comentario.autor }}</small>
        </div>
        <hr class="text-gris-claro mb-5 mt-2">
        <p class="post__contenido">{{ comentario.contenido | safe }}</p>
    </li>
{% endmacro %}
